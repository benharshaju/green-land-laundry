name: Deploy to masterkuttu.space

on:
  push:
    branches:
      - claude/connect-remote-control-cfpwb
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Hostinger
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 91.108.107.152
          username: u720252335
          password: Greenland@123
          port: 65002
          command_timeout: 30m
          script: |
            set -e
            echo "=== Starting deployment ==="

            SITE_DIR="$HOME/domains/masterkuttu.space/public_html"

            # Check if directory exists, try alternate Hostinger paths
            if [ ! -d "$HOME/domains" ]; then
              # Try alternate Hostinger directory structures
              if [ -d "$HOME/public_html" ]; then
                SITE_DIR="$HOME/public_html"
              elif [ -d "$HOME/htdocs" ]; then
                SITE_DIR="$HOME/htdocs"
              else
                echo "Looking for web root..."
                find $HOME -maxdepth 3 -name "public_html" -type d 2>/dev/null || true
                find $HOME -maxdepth 3 -name "htdocs" -type d 2>/dev/null || true
                ls -la $HOME/
                SITE_DIR="$HOME/public_html"
              fi
            fi

            echo "Using site directory: $SITE_DIR"

            # Backup existing site (if any content)
            if [ -d "$SITE_DIR" ] && [ "$(ls -A $SITE_DIR 2>/dev/null)" ]; then
              echo "Backing up existing content..."
              mkdir -p $HOME/backups
              tar czf $HOME/backups/pre-deploy-$(date +%Y%m%d%H%M%S).tar.gz -C $SITE_DIR . 2>/dev/null || true
            fi

            # Check if git repo already exists
            if [ -d "$SITE_DIR/.git" ]; then
              echo "Updating existing repo..."
              cd $SITE_DIR
              git fetch origin claude/connect-remote-control-cfpwb
              git checkout claude/connect-remote-control-cfpwb
              git pull origin claude/connect-remote-control-cfpwb
            else
              echo "Fresh clone..."
              # Clean directory but preserve .htaccess if exists
              if [ -f "$SITE_DIR/.htaccess" ]; then
                cp $SITE_DIR/.htaccess /tmp/.htaccess.bak 2>/dev/null || true
              fi
              rm -rf $SITE_DIR 2>/dev/null || true
              git clone -b claude/connect-remote-control-cfpwb https://github.com/benharshaju/green-land-laundry.git $SITE_DIR
              cd $SITE_DIR
            fi

            echo "=== Installing PHP dependencies ==="
            cd $SITE_DIR

            # Check PHP version
            php -v

            # Install composer if not available
            if ! command -v composer &>/dev/null; then
              if [ ! -f "$HOME/bin/composer" ]; then
                mkdir -p $HOME/bin
                curl -sS https://getcomposer.org/installer | php -- --install-dir=$HOME/bin --filename=composer
              fi
              export PATH="$HOME/bin:$PATH"
            fi

            composer install --no-dev --optimize-autoloader --no-interaction

            echo "=== Setting up environment ==="
            if [ ! -f .env ]; then
              cp .env.example .env
            fi

            # Update APP_URL
            sed -i "s|APP_URL=.*|APP_URL=https://masterkuttu.space|" .env
            sed -i "s|APP_ENV=.*|APP_ENV=production|" .env
            sed -i "s|APP_DEBUG=.*|APP_DEBUG=false|" .env

            # Generate app key
            php artisan key:generate --force

            echo "=== Building frontend ==="
            # Check if node is available
            if command -v node &>/dev/null; then
              node -v
              npm ci 2>/dev/null || npm install
              npm run build
            else
              echo "Node.js not available, using pre-built assets from repo"
              # The public/build directory should be in the repo already
              ls -la public/build/ 2>/dev/null || echo "No pre-built assets found"
            fi

            echo "=== Setting permissions ==="
            chmod -R 755 storage bootstrap/cache 2>/dev/null || true
            chmod -R 775 storage 2>/dev/null || true

            echo "=== Ensuring .htaccess for Hostinger ==="
            # Root .htaccess to route everything to public/
            if [ ! -f .htaccess ] || ! grep -q 'public/' .htaccess; then
              cat > .htaccess << 'HTEOF'
<IfModule mod_rewrite.c>
    RewriteEngine On
    RewriteRule ^(.*)$ public/$1 [L]
</IfModule>
HTEOF
              echo "Created root .htaccess"
            fi

            echo "=== Database setup ==="
            # Try to run migrations (will fail if DB not configured, that's ok)
            php artisan migrate --force 2>&1 || echo "DB migration skipped - configure DB in .env first"
            php artisan db:seed --force 2>&1 || echo "DB seed skipped"

            echo "=== Optimizing Laravel ==="
            php artisan config:cache 2>/dev/null || php artisan config:clear
            php artisan route:cache 2>/dev/null || php artisan route:clear
            php artisan view:cache
            php artisan storage:link 2>/dev/null || true

            echo ""
            echo "========================================="
            echo "  DEPLOYMENT COMPLETE!"
            echo "  https://masterkuttu.space"
            echo "========================================="

      - name: Verify site is live
        run: |
          sleep 15
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://masterkuttu.space)
          echo "Site status: $STATUS"
          BODY=$(curl -s https://masterkuttu.space | head -50)
          echo "$BODY"
          if [ "$STATUS" -eq 200 ] || [ "$STATUS" -eq 302 ]; then
            echo "Site is LIVE!"
          else
            echo "Status: $STATUS - may need DB configuration"
          fi
